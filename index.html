<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde6ef">
<title>Sorpresa de amor 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@1,500;1,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main>
  <!-- ═════════ VISTA 1 · Creador ═════════ -->
  <section id="view-creator" class="view">
    <form id="form" class="panel" novalidate>
      <h1>Crea tu sorpresa</h1>
      <p class="lead">Rellena los datos. Todo se guarda solo en este navegador.</p>

      <div class="row">
        <label>Nombre 1<input id="n1" maxlength="30" autocomplete="off" placeholder="Luciano"></label>
        <label>Nombre 2<input id="n2" maxlength="30" autocomplete="off" placeholder="Valentina"></label>
      </div>

      <label>Fecha de inicio de la relación<input type="date" id="date"></label>

      <label>Foto de portada<input type="file" id="photo" accept="image/*">
        <small>Se reduce automáticamente (máx. 10 MB de origen).</small>
      </label>
      <div class="thumb" id="thumb" hidden><img alt="Vista previa de la foto"><span>Así se verá tu foto</span></div>

      <label>Tu carta<textarea id="letter" rows="7" maxlength="1200" placeholder="Escribe aquí lo que quieres decirle…"></textarea></label>

      <fieldset>
        <legend>Lo que amo de ti (4 o 5)</legend>
        <div id="loves"></div>
        <button type="button" class="ghost" id="add-love">+ Añadir</button>
      </fieldset>

      <fieldset>
        <legend>Vales de amor (3 a 5)</legend>
        <div id="vouchers"></div>
        <button type="button" class="ghost" id="add-voucher">+ Añadir</button>
      </fieldset>

      <label>Mapa de un lugar especial (opcional)
        <textarea id="map" rows="3" placeholder='<iframe src="https://www.google.com/maps/embed?..."></iframe>'></textarea>
        <small>Google Maps → Compartir → Insertar un mapa → Copiar HTML.</small>
      </label>

      <p id="error" class="error" role="alert" hidden></p>
      <button type="submit" class="cta big-cta">Generar sorpresa</button>
      <button type="button" class="link" id="reset">Empezar de cero</button>
    </form>
  </section>

  <!-- ═════════ VISTA 2 · Sorpresa ═════════ -->
  <section id="view-result" class="view" hidden>
    <button id="edit" class="edit" type="button" aria-label="Editar sorpresa">✎</button>

    <h1 id="r-title" class="title" data-aos="fade-down"></h1>

    <article class="glass polaroid" data-aos="fade-up">
      <img id="r-photo" alt="Nuestra foto">
      <p id="r-since" class="since"></p>
      <div class="count" role="timer" aria-label="Tiempo juntos">
        <div><b>0</b><small>meses</small></div>
        <div><b>0</b><small>días</small></div>
        <div><b>00</b><small>horas</small></div>
        <div><b>00</b><small>min</small></div>
        <div><b>00</b><small>seg</small></div>
      </div>
    </article>

    <section class="glass" data-aos="fade-up">
      <blockquote id="r-letter"></blockquote>
      <p id="r-sign" class="sign"></p>
    </section>

    <section class="glass" data-aos="fade-up">
      <h2>Lo que amo de ti</h2>
      <ul id="r-loves" class="loves"></ul>
    </section>

    <section class="glass" id="r-map-box" data-aos="fade-up">
      <h2>Nuestro lugar especial</h2>
      <div id="r-map" class="map"></div>
    </section>

    <section class="glass" data-aos="fade-up">
      <h2>Nuestros vales</h2>
      <div id="r-vouchers"></div>
    </section>

    <section class="glass ask" id="ask" data-aos="zoom-in">
      <h2>¿Me dejas hacerte la mujer más feliz?</h2>
      <div class="answers">
        <button type="button" class="cta" id="yes">Sí 💖</button>
        <span class="slot"><button type="button" class="ghost" id="no">No</button></span>
      </div>
    </section>
  </section>
</main>

<!-- Modal reutilizable (canjear vale / respuesta "Sí") -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="box">
    <div class="big" id="m-emoji">💖</div>
    <h3 id="m-title"></h3>
    <p id="m-text"></p>
    <button type="button" class="cta" id="m-close">Cerrar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
